<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coalition | Crafted in Baltimore</title>
  <meta name="description"
    content="Coalition is a premium streetwear brand born in Baltimore. Quality, community, and the hustle. Shop the latest drops and join the movement." />
  <meta property="og:title" content="Coalition | Crafted in Baltimore" />
  <meta property="og:description"
    content="Premium streetwear designed for the city that built us. Join the Coalition." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sgcoalition.xyz" />
  <meta property="og:image"
    content="https://sgcoalition.xyz/hero-cinematic.png" />
  <meta property="og:site_name" content="Coalition" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@sgcoalition" />
  <meta name="twitter:title" content="Coalition | Crafted in Baltimore" />
  <meta name="twitter:description"
    content="Premium streetwear designed for the city that built us. Join the Coalition." />
  <meta name="twitter:image" content="https://sgcoalition.xyz/hero-cinematic.png" />
  <link rel="canonical" href="https://sgcoalition.xyz" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/images/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050505">

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="dns-prefetch" href="https://neftyblocks.com">
  <link rel="dns-prefetch" href="https://opensea.io">
  <link rel="dns-prefetch" href="https://api.dexscreener.com">
  <link rel="dns-prefetch" href="https://polygon-rpc.com">

  <!-- PayPal SDK -->
  <script
    src="https://www.paypal.com/sdk/js?client-id=%VITE_PAYPAL_CLIENT_ID%&currency=USD&intent=capture&components=buttons"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Oswald:wght@500;700&display=swap"
    rel="stylesheet">
  <script>
    // Unregister any stale service workers to prevent cached JS from causing infinite loops
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (const registration of registrations) {
          registration.unregister();
          console.log('SW unregistered:', registration.scope);
        }
      });
    }
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Oswald', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#050505', // Deep Black
              dark: '#111111',  // Off-Black
              gray: '#222222',  // Dark Gray
              chrome: '#E5E5E5', // Silver/Chrome
              accent: '#3B82F6', // Web3 Blue
            }
          },
          backgroundImage: {
            'noise': "url('/images/patterns/noise.svg')",
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050505;
      color: #E5E5E5;
      -webkit-font-smoothing: antialiased;
    }

    /* Global Noise Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .glass-panel {
      background: rgba(5, 5, 5, 0.8);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Text Glow Utility */
    .text-glow {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .box-glow {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    /* Antigravity Card */
    .antigravity-card {
      background: rgba(255, 255, 255, 0.03);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 4px 30px rgba(0, 0, 0, 0.1),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      transition: all 0.3s ease;
    }

    .antigravity-card:hover {
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.2),
        0 0 0 1px rgba(255, 255, 255, 0.1) inset,
        0 0 20px rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    /* Initial Loader (shown before React mounts).
       Lives in <head> (not inside #root) so the styles are guaranteed
       to be applied before the loader is painted, even on extremely
       slow connections where the browser might otherwise paint an
       unstyled loader. */
    #initial-loader {
      position: fixed;
      inset: 0;
      background-color: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: 'Oswald', sans-serif;
      color: #E5E5E5;
      transition: opacity 0.5s ease;
    }
    #initial-loader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3B82F6; /* Brand accent blue */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    #initial-loader .brand {
      letter-spacing: 4px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* No-JS fallback. Only visible when JavaScript is disabled.
       z-index sits above #initial-loader so it covers the spinner. */
    #noscript-fallback {
      position: fixed;
      inset: 0;
      background-color: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100000;
      font-family: 'Oswald', sans-serif;
      color: #E5E5E5;
      text-align: center;
      padding: 2rem;
    }
    #noscript-fallback .brand {
      letter-spacing: 4px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    #noscript-fallback h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 1rem;
      color: #E5E5E5;
    }
    #noscript-fallback p {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #999;
      max-width: 30rem;
      line-height: 1.5;
      margin: 0;
    }
    #noscript-fallback .basic-site-link {
      margin-top: 1.5rem;
    }
    #noscript-fallback .basic-site-link a {
      color: #3B82F6;
      text-decoration: none;
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.85rem;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.2s ease;
    }
    #noscript-fallback .basic-site-link a:hover {
      border-bottom-color: #3B82F6;
    }

    @media print {
      @page {
        margin: 1cm;
      }

      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: white;
        color: black;
      }

      body::before {
        display: none;
      }

      #initial-loader {
        display: none !important;
      }

      #noscript-fallback {
        display: none !important;
      }

      .print\:hidden {
        display: none !important;
      }

      .print\:block {
        display: block !important;
      }

      .print\:p-0 {
        padding: 0 !important;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- This loader shows instantly before your React app loads.
         Styles live in the <head> <style> block to avoid any flash
         of unstyled content on extremely slow connections. -->
    <div id="initial-loader">
      <div class="spinner"></div>
      <div class="brand">Coalition</div>
    </div>

    <!-- Shown only when JavaScript is disabled (browsers ignore
         <noscript> content when JS is on). Covers the loader so the
         user gets a clear message instead of an infinite spinner. -->
    <noscript>
      <div id="noscript-fallback">
        <div class="brand">Coalition</div>
        <h1>JavaScript is required</h1>
        <p>This site needs JavaScript to run. Please enable it in your browser settings, then reload the page.</p>
        <p class="basic-site-link"><a href="/nojs.html">View our basic site &rarr;</a></p>
      </div>
    </noscript>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
