<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>PARTS / CLOSING RUN — Y2K carousel slide __SLIDE_N__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0d0d10; color: #f4f2ec; }
  body { font-family: 'Space Grotesk', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  :root {
    --ink: #0d0d10;
    --ink-2: #141418;
    --paper: #f4f2ec;
    --steel-e: #e6e8ec;
    --steel: #b9becb;
    --steel-d: #6f7480;
    --oxblood: #74182a;
    --oxblood-light: #9a3f45;
    --rust: #984331;
    --cream: #e7d8c8;
    --cream-soft: #f0e4d7;
    --chrome-a: #fff;
    --chrome-b: #d8dde6;
    --chrome-c: #9aa2b2;
  }
  .canvas {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(circle at 18px 18px, rgba(116,24,42,.18) 2px, transparent 2.5px) 0 0 / 36px 36px,
      linear-gradient(135deg, #141418 0%, #0d0d10 55%, #17171c 100%);
  }
  .frame {
    position: absolute; inset: 30px; overflow: hidden;
    border: 5px solid var(--ink); border-radius: 28px;
    box-shadow: 0 0 0 10px var(--oxblood), 0 0 0 15px var(--ink), 18px 22px 0 rgba(13,13,16,.7);
    background: linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  }
  .frame::after {
    content: ''; position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: .16;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
  }
  .chrome {
    color: transparent; background: linear-gradient(180deg,#fff 0%,var(--chrome-b) 18%,var(--chrome-c) 34%,#fff 48%,var(--steel) 60%,#fff 76%,#cfd5df 92%,#fff 100%);
    background-clip: text; -webkit-background-clip: text; -webkit-text-stroke: 1px rgba(255,255,255,.85);
    filter: drop-shadow(4px 5px 0 #0d0d10) drop-shadow(8px 8px 0 var(--oxblood));
  }
  .display { font-family: 'Orbitron','Arial Black',Impact,sans-serif; font-weight: 900; letter-spacing: -.055em; line-height: .9; }
  .condensed { font-family: 'Bebas Neue','Arial Narrow',Impact,sans-serif; letter-spacing: .015em; }
  .logo-tile {
    width: 116px; height: 106px; padding: 10px; display: grid; place-items: center;
    background: #050505; border: 4px solid var(--ink); border-radius: 17px;
    box-shadow: 6px 7px 0 var(--oxblood), 9px 10px 0 var(--ink); transform: rotate(-4deg);
  }
  .logo-tile img { width: 100%; height: 100%; object-fit: contain; }
  .micro { font-family: 'Orbitron',monospace; font-weight: 700; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }
  .sticker {
    position: absolute; z-index: 8; display: grid; place-items: center; text-align: center;
    border: 4px solid var(--ink); color: var(--ink); font-weight: 900;
    box-shadow: 7px 8px 0 var(--ink); transform: rotate(7deg);
  }
  .sticker-star { width: 186px; height: 186px; padding: 24px; background: var(--cream); clip-path: polygon(50% 0%,61% 28%,88% 12%,77% 40%,100% 50%,77% 61%,89% 88%,61% 77%,50% 100%,39% 77%,12% 89%,23% 61%,0% 50%,23% 39%,11% 12%,39% 23%); }
  .sticker-round { width: 150px; height: 150px; border-radius: 50%; background: var(--steel); transform: rotate(-9deg); }
  .scribble { color: var(--cream); text-shadow: 2px 2px var(--ink); font-size: 46px; letter-spacing: .08em; }
  .media {
    position: absolute; overflow: hidden; background: #000; /* the 3/4 shots are shot on pure black */
    border: 5px solid var(--ink); border-radius: 20px;
    box-shadow: 12px 13px 0 var(--oxblood), 16px 17px 0 var(--ink);
  }
  /* The 4/4 shots are studio frames on a light background; the card ground is
     set inline to the photo's own corner colour so rotation shows no seam. */
  .media.studio { background: #fafbf9; }
  .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .media-contain img { object-fit: contain; }
  .label-bar { display: inline-flex; gap: 12px; align-items: center; padding: 10px 18px; background: var(--ink); color: #fff; border: 3px solid var(--steel-d); border-radius: 999px; box-shadow: 4px 5px 0 var(--oxblood); text-transform: uppercase; letter-spacing: .12em; font: 700 17px 'Orbitron',sans-serif; }
  .tiny-star { color: var(--cream); font-size: 42px; text-shadow: 2px 2px var(--ink); }

  /* 01 — cover / product hero */
  .slide-1 .topline { position: absolute; z-index: 5; top: 45px; left: 44px; right: 44px; display: flex; align-items: center; justify-content: space-between; }
  .slide-1 .hero-photo { left: 108px; top: 224px; width: 760px; height: 770px; transform: rotate(-2deg); }
  .slide-1 .hero-photo img { object-fit: cover; }
  .slide-1 .title { position: absolute; z-index: 7; left: 40px; right: 25px; top: 225px; font-size: 110px; text-align: center; -webkit-text-stroke-width: 0; }
  .slide-1 .cream-word { color: var(--cream); -webkit-text-stroke: 3px var(--ink); text-shadow: 7px 8px #0d0d10; }
  .slide-1 .steel-word { display: block; margin-top: 505px; font-size: 84px; }
  .slide-1 .product-name { position: absolute; left: 60px; right: 60px; bottom: 106px; z-index: 8; text-align: center; font-size: 33px; font-weight: 700; letter-spacing: .05em; }
  .slide-1 .issue { position: absolute; left: 45px; bottom: 38px; z-index: 8; font: 700 18px 'Orbitron',sans-serif; letter-spacing: .18em; }
  .slide-1 .price-tag { position: absolute; right: 48px; bottom: 44px; z-index: 8; padding: 11px 22px; background: var(--cream); border: 4px solid var(--ink); border-radius: 999px; box-shadow: 5px 6px 0 var(--ink); font: 900 26px 'Orbitron',sans-serif; color: var(--ink); transform: rotate(-5deg); }
  .slide-1 .sticker { right: 34px; top: 306px; }

  /* 02 — detail / industrial finish */
  .slide-2 .eyebrow { position: absolute; left: 46px; top: 45px; z-index: 5; }
  .slide-2 .headline { position: absolute; left: 54px; top: 116px; width: 830px; z-index: 6; font-size: 78px; }
  .slide-2 .detail-photo { left: 115px; top: 302px; width: 770px; height: 688px; transform: rotate(2.2deg); }
  .slide-2 .caption { position: absolute; left: 70px; right: 70px; bottom: 114px; z-index: 7; font-size: 29px; font-weight: 700; line-height: 1.35; color: var(--paper); }
  .slide-2 .mini-sticker { position: absolute; right: 52px; bottom: 25px; z-index: 7; padding: 13px 23px; background: var(--steel); border: 4px solid var(--ink); border-radius: 11px; transform: rotate(5deg); font: 900 20px 'Orbitron',sans-serif; color: var(--ink); box-shadow: 5px 6px 0 var(--ink); }

  /* 03 — the run closes / inventory card */
  .slide-3 .run-photo { right: 45px; top: 104px; width: 555px; height: 730px; transform: rotate(3deg); }
  .slide-3 .eyebrow { position: absolute; left: 55px; top: 64px; z-index: 5; }
  .slide-3 .run-count { position: absolute; left: 45px; top: 318px; width: 545px; z-index: 7; font-size: 86px; }
  .slide-3 .run-count span { display: block; font-size: 116px; }
  .slide-3 .run-panel { position: absolute; z-index: 8; left: 47px; right: 47px; bottom: 92px; height: 262px; display: flex; align-items: center; justify-content: space-between; padding: 34px 48px; background: var(--ink); color: white; border: 5px solid var(--steel-d); border-radius: 28px; box-shadow: 12px 13px 0 var(--oxblood); transform: rotate(-1deg); }
  .slide-3 .run-panel .qty { font: 900 44px 'Orbitron',sans-serif; color: var(--cream); }
  .slide-3 .run-panel .price { font: 900 62px 'Bebas Neue',Impact,sans-serif; color: white; text-align: right; }
  .slide-3 .run-panel small { display: block; margin-top: 10px; color: var(--steel); font: 700 17px 'Space Grotesk',sans-serif; letter-spacing: .12em; text-transform: uppercase; }

  /* 04 — the four-part assembly (no BTS photo for this run) */
  .slide-4 .pair-3 { left: 46px; top: 112px; width: 470px; height: 690px; transform: rotate(-2deg); }
  .slide-4 .pair-4 { left: 300px; top: 360px; width: 470px; height: 690px; transform: rotate(3deg); z-index: 7; }
  .slide-4 .note-card { position: absolute; z-index: 8; right: 45px; top: 96px; width: 372px; padding: 28px 26px; background: var(--cream); border: 5px solid var(--ink); border-radius: 22px; box-shadow: 10px 11px 0 var(--ink); transform: rotate(4deg); color: var(--ink); }
  .slide-4 .note-card .kicker { font: 700 17px 'Orbitron',sans-serif; letter-spacing: .12em; }
  .slide-4 .note-card .belief { margin-top: 26px; font: 900 47px/1.04 'Orbitron',sans-serif; letter-spacing: -.08em; }
  .slide-4 .note-card .sub { margin-top: 22px; font-size: 22px; font-weight: 700; line-height: 1.35; }
  .slide-4 .bts-tag { position: absolute; z-index: 9; right: 44px; bottom: 196px; width: 330px; padding: 18px 20px; text-align: center; color: var(--ink); background: var(--steel); border: 4px solid var(--ink); border-radius: 999px; box-shadow: 6px 7px 0 var(--ink); transform: rotate(-6deg); font: 900 20px 'Orbitron',sans-serif; }
  .slide-4 .bts-footer { position: absolute; z-index: 9; left: 54px; right: 50px; bottom: 47px; display: flex; align-items: center; justify-content: space-between; font: 700 17px 'Orbitron',sans-serif; letter-spacing: .13em; color: var(--paper); }

  /* 05 — shop card */
  .slide-5 .cta-photo { left: 74px; top: 100px; width: 620px; height: 770px; transform: rotate(-3deg); }
  .slide-5 .cta-sticker { right: 47px; top: 255px; width: 280px; height: 280px; padding: 45px; z-index: 9; font: 900 30px/1.05 'Orbitron',sans-serif; }
  .slide-5 .cta-copy { position: absolute; z-index: 9; left: 54px; right: 54px; bottom: 76px; padding: 40px 45px; background: var(--ink); color: white; border: 5px solid var(--steel-d); border-radius: 26px; box-shadow: 12px 13px 0 var(--oxblood); }
  .slide-5 .cta-copy .shop { font: 900 82px/.95 'Orbitron',sans-serif; letter-spacing: -.08em; color: var(--steel-e); text-shadow: 4px 4px 0 var(--oxblood); }
  .slide-5 .cta-copy .details { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 26px; font: 700 21px 'Space Grotesk',sans-serif; letter-spacing: .05em; }
  .slide-5 .cta-copy .url { margin-top: 18px; color: var(--cream); font: 700 21px 'Orbitron',sans-serif; letter-spacing: .05em; }

  .slide-index { position: absolute; z-index: 10; right: 42px; top: 43px; width: 56px; height: 56px; display: grid; place-items: center; background: var(--paper); border: 4px solid var(--ink); border-radius: 50%; font: 900 18px 'Orbitron',sans-serif; color: var(--ink); box-shadow: 4px 5px 0 var(--oxblood); }
  .spark { position: absolute; z-index: 6; color: var(--cream); -webkit-text-stroke: 1px var(--ink); font-size: 50px; text-shadow: 3px 4px #0d0d10; }
  .no-reprints { display: inline-block; padding: 9px 14px; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-radius: 5px; box-shadow: 4px 5px 0 var(--ink); font: 700 16px 'Orbitron',sans-serif; transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="canvas">
  <main class="frame" id="frame"></main>
</div>
<script>
(function () {
  var slideNo = Number('__SLIDE_N__');
  var front34 = '../../public/images/parts-wallet-3-4-front.png';
  var back34 = '../../public/images/parts-wallet-3-4-back.png';
  var front44 = '../../public/images/parts-wallet-4-4-front.png';
  var back44 = '../../public/images/parts-wallet-4-4-back.png';
  var logo = '../../public/images/logo.png';
  var frame = document.getElementById('frame');
  var img = function(src, alt) { return '<img src="' + src + '" alt="' + alt + '">'; };
  var scenes = {
    1: '<div class="slide-1">' +
      '<div class="topline"><div class="logo-tile">' + img(logo, 'Coalition logo') + '</div><span class="label-bar">PARTS / FINAL RUN</span></div>' +
      '<div class="media hero-photo">' + img(front34, 'Coalition Parts Wallet 3/4 front') + '</div>' +
      '<div class="title display"><span class="cream-word">PARTS</span><span class="steel-word chrome">/ CLOSING RUN</span></div>' +
      '<div class="sticker sticker-star micro">FINAL<br>TWO<br>LEFT</div>' +
      '<div class="product-name">COALITION &lsquo;PARTS&rsquo; WALLET &mdash; 3/4 &amp; 4/4</div>' +
      '<div class="issue">TRUST YOURSELF &#10022;</div><div class="price-tag">$45 &middot; $60</div>' +
      '<span class="spark" style="left:52px;top:330px">&#10022;</span><span class="spark" style="right:95px;top:280px">&#10023;</span></div>',
    2: '<div class="slide-2">' +
      '<span class="eyebrow label-bar">DETAIL STUDY / 02</span>' +
      '<div class="headline display chrome">INDUSTRIAL<br>DETAILING.</div>' +
      '<div class="media detail-photo">' + img(back34, 'Coalition Parts Wallet 3/4 back detail') + '</div>' +
      '<div class="caption">Raw-edge construction. One Coalition mark.<br>Numbered once &mdash; never reprinted.</div>' +
      '<div class="mini-sticker">UP CLOSE &#10022;</div><span class="spark" style="right:70px;top:165px">&#10023;</span></div>',
    3: '<div class="slide-3">' +
      '<span class="eyebrow label-bar">THE RUN CLOSES / 03</span>' +
      '<div class="media studio run-photo" style="background:#fafbf9">' + img(front44, 'Coalition Parts Wallet 4/4 front') + '</div>' +
      '<div class="run-count display chrome">THE RUN<span>CLOSES.</span></div>' +
      '<div class="run-panel"><div><div class="qty">1 OF EACH LEFT</div><small>Parts 3/4 &amp; 4/4</small></div><div class="price">$45 / $60<small>No reprints</small></div></div>' +
      '<span class="spark" style="right:640px;top:235px">&#10022;</span></div>',
    4: '<div class="slide-4">' +
      '<span class="eyebrow label-bar" style="position:absolute;left:47px;top:35px;z-index:9">COALITION / THE ASSEMBLY</span>' +
      '<div class="media pair-3">' + img(front34, 'Coalition Parts Wallet 3/4 front') + '</div>' +
      '<div class="media studio pair-4" style="background:#e8e9e8">' + img(back44, 'Coalition Parts Wallet 4/4 back') + '</div>' +
      '<div class="note-card"><div class="kicker">FOUR PIECES, ONE LINEAGE</div><div class="belief">TRUST<br>YOURSELF.</div><div class="sub">Coalition is action.<br>Show up.</div></div>' +
      '<div class="bts-tag">THE CLOSING<br>PAIR &#10022;</div>' +
      '<div class="bts-footer"><span>PARTS / 3/4 + 4/4</span><span>04 &mdash; ASSEMBLY</span></div></div>',
    5: '<div class="slide-5">' +
      '<span class="eyebrow label-bar" style="position:absolute;left:48px;top:42px;z-index:9">THE FINAL PIECE / 05</span>' +
      '<div class="media studio cta-photo" style="background:#e8e9e8">' + img(back44, 'Coalition Parts Wallet 4/4 back') + '</div>' +
      '<div class="sticker sticker-star cta-sticker">4 OF 4<br>&#10022;</div>' +
      '<div class="cta-copy"><div class="shop">SHOP<br>THE RUN &rarr;</div><div class="details"><span>3/4 &middot; $45</span><span>4/4 &middot; $60</span><span>NO REPRINTS</span></div><div class="url">linktr.ee/sgcoalition</div></div>' +
      '<span class="spark" style="left:735px;top:140px">&#10022;</span></div>'
  };
  frame.innerHTML = '<div class="slide-index">' + String(slideNo).padStart(2,'0') + '</div>' + scenes[slideNo];
})();
</script>
</body>
</html>
