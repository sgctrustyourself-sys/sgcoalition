<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>PINK / SILVER — Y2K carousel slide __SLIDE_N__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #ffbce1; color: #111; }
  body { font-family: 'Space Grotesk', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  :root {
    --pink: #ff3daf;
    --pink-light: #ffd7ed;
    --blue: #8cecff;
    --lime: #e8ff6a;
    --black: #101014;
    --chrome-a: #fff;
    --chrome-b: #a7f3ff;
    --chrome-c: #b9becb;
  }
  .canvas {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(circle at 18px 18px, rgba(255,61,175,.24) 2px, transparent 2.5px) 0 0 / 36px 36px,
      linear-gradient(135deg, #fff0f8 0%, #ffd0e9 53%, #f3c6ff 100%);
  }
  .frame {
    position: absolute; inset: 30px; overflow: hidden;
    border: 5px solid var(--black); border-radius: 28px;
    box-shadow: 0 0 0 10px var(--pink), 0 0 0 15px var(--black), 18px 22px 0 rgba(16,16,20,.22);
    background: linear-gradient(150deg, rgba(255,255,255,.84), rgba(255,239,248,.76));
  }
  .frame::after {
    content: ''; position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: .13;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
  }
  .chrome {
    color: transparent; background: linear-gradient(180deg,#fff 0%,#dffbff 18%,#7dddf2 34%,#fff 48%,#b6bdce 60%,#fff 76%,#fa9fd2 92%,#fff 100%);
    background-clip: text; -webkit-background-clip: text; -webkit-text-stroke: 1px rgba(255,255,255,.85);
    filter: drop-shadow(4px 5px 0 #111) drop-shadow(8px 8px 0 var(--pink));
  }
  .display { font-family: 'Orbitron','Arial Black',Impact,sans-serif; font-weight: 900; letter-spacing: -.055em; line-height: .9; }
  .condensed { font-family: 'Bebas Neue','Arial Narrow',Impact,sans-serif; letter-spacing: .015em; }
  .logo-tile {
    width: 116px; height: 106px; padding: 10px; display: grid; place-items: center;
    background: #050505; border: 4px solid var(--black); border-radius: 17px;
    box-shadow: 6px 7px 0 var(--pink), 9px 10px 0 var(--black); transform: rotate(-4deg);
  }
  .logo-tile img { width: 100%; height: 100%; object-fit: contain; }
  .micro { font-family: 'Orbitron',monospace; font-weight: 700; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }
  .sticker {
    position: absolute; z-index: 8; display: grid; place-items: center; text-align: center;
    border: 4px solid var(--black); color: var(--black); font-weight: 900;
    box-shadow: 7px 8px 0 var(--black); transform: rotate(7deg);
  }
  .sticker-star { width: 186px; height: 186px; padding: 24px; background: var(--lime); clip-path: polygon(50% 0%,61% 28%,88% 12%,77% 40%,100% 50%,77% 61%,89% 88%,61% 77%,50% 100%,39% 77%,12% 89%,23% 61%,0% 50%,23% 39%,11% 12%,39% 23%); }
  .sticker-round { width: 150px; height: 150px; border-radius: 50%; background: var(--blue); transform: rotate(-9deg); }
  .scribble { color: var(--pink); text-shadow: 2px 2px var(--black); font-size: 46px; letter-spacing: .08em; }
  .media {
    position: absolute; overflow: hidden; background: #101014;
    border: 5px solid var(--black); border-radius: 20px;
    box-shadow: 12px 13px 0 var(--pink), 16px 17px 0 var(--black);
  }
  .media img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .media-contain img { object-fit: contain; }
  .label-bar { display: inline-flex; gap: 12px; align-items: center; padding: 10px 18px; background: var(--black); color: #fff; border: 3px solid var(--black); border-radius: 999px; box-shadow: 4px 5px 0 var(--pink); text-transform: uppercase; letter-spacing: .12em; font: 700 17px 'Orbitron',sans-serif; }
  .tiny-star { color: var(--pink); font-size: 42px; text-shadow: 2px 2px var(--black); }

  /* 01 — Y2K cover / product hero */
  .slide-1 .topline { position: absolute; z-index: 5; top: 45px; left: 44px; right: 44px; display: flex; align-items: center; justify-content: space-between; }
  .slide-1 .hero-photo { left: 108px; top: 224px; width: 760px; height: 770px; transform: rotate(-2deg); }
  .slide-1 .hero-photo img { object-fit: cover; }
  .slide-1 .title { position: absolute; z-index: 7; left: 40px; right: 25px; top: 225px; font-size: 104px; text-align: center; -webkit-text-stroke-width: 0; }
  .slide-1 .pink-word { color: var(--pink); -webkit-text-stroke: 3px var(--black); text-shadow: 7px 8px #fff; }
  .slide-1 .silver-word { display: block; margin-top: 515px; font-size: 100px; }
  .slide-1 .product-name { position: absolute; left: 70px; right: 70px; bottom: 105px; z-index: 8; text-align: center; font-size: 35px; font-weight: 700; letter-spacing: .06em; }
  .slide-1 .issue { position: absolute; left: 45px; bottom: 38px; z-index: 8; font: 700 18px 'Orbitron',sans-serif; letter-spacing: .18em; }
  .slide-1 .price-tag { position: absolute; right: 48px; bottom: 44px; z-index: 8; padding: 11px 24px; background: var(--lime); border: 4px solid var(--black); border-radius: 999px; box-shadow: 5px 6px 0 var(--black); font: 900 29px 'Orbitron',sans-serif; transform: rotate(-5deg); }
  .slide-1 .sticker { right: 42px; top: 620px; }

  /* 02 — detail / silver on rose */
  .slide-2 .eyebrow { position: absolute; left: 46px; top: 45px; z-index: 5; }
  .slide-2 .headline { position: absolute; left: 54px; top: 116px; width: 790px; z-index: 6; font-size: 82px; }
  .slide-2 .detail-photo { left: 115px; top: 302px; width: 770px; height: 688px; transform: rotate(2.2deg); }
  .slide-2 .caption { position: absolute; left: 70px; right: 70px; bottom: 114px; z-index: 7; font-size: 29px; font-weight: 700; line-height: 1.35; }
  .slide-2 .mini-sticker { position: absolute; right: 52px; bottom: 25px; z-index: 7; padding: 13px 23px; background: var(--blue); border: 4px solid var(--black); border-radius: 11px; transform: rotate(5deg); font: 900 20px 'Orbitron',sans-serif; box-shadow: 5px 6px 0 var(--black); }

  /* 03 — limited run / chrome inventory card */
  .slide-3 .run-photo { right: 45px; top: 104px; width: 555px; height: 730px; transform: rotate(3deg); }
  .slide-3 .eyebrow { position: absolute; left: 55px; top: 64px; z-index: 5; }
  .slide-3 .run-count { position: absolute; left: 45px; top: 350px; width: 540px; z-index: 7; font-size: 104px; }
  .slide-3 .run-count span { display: block; font-size: 141px; }
  .slide-3 .run-panel { position: absolute; z-index: 8; left: 47px; right: 47px; bottom: 92px; height: 260px; display: flex; align-items: center; justify-content: space-between; padding: 34px 52px; background: var(--black); color: white; border: 5px solid var(--black); border-radius: 28px; box-shadow: 12px 13px 0 var(--pink); transform: rotate(-1deg); }
  .slide-3 .run-panel .qty { font: 900 51px 'Orbitron',sans-serif; color: var(--lime); }
  .slide-3 .run-panel .price { font: 900 78px 'Bebas Neue',Impact,sans-serif; color: white; }
  .slide-3 .run-panel small { display: block; margin-top: 10px; color: #ffc6e7; font: 700 17px 'Space Grotesk',sans-serif; letter-spacing: .12em; text-transform: uppercase; }

  /* 04 — maker/process photo as brand BTS, not product fit imagery */
  .slide-4 .maker-photo { left: 46px; top: 98px; width: 585px; height: 1060px; transform: rotate(-2deg); }
  .slide-4 .maker-photo img { object-position: center center; }
  .slide-4 .note-card { position: absolute; z-index: 8; right: 45px; top: 245px; width: 370px; padding: 30px 26px; background: var(--lime); border: 5px solid var(--black); border-radius: 22px; box-shadow: 10px 11px 0 var(--black); transform: rotate(4deg); }
  .slide-4 .note-card .kicker { font: 700 17px 'Orbitron',sans-serif; letter-spacing: .12em; }
  .slide-4 .note-card .belief { margin-top: 30px; font: 900 49px/1.04 'Orbitron',sans-serif; letter-spacing: -.08em; }
  .slide-4 .note-card .sub { margin-top: 24px; font-size: 23px; font-weight: 700; line-height: 1.35; }
  .slide-4 .bts-tag { position: absolute; z-index: 9; right: 44px; bottom: 194px; width: 323px; padding: 18px 20px; text-align: center; color: #fff; background: var(--pink); border: 4px solid var(--black); border-radius: 999px; box-shadow: 6px 7px 0 var(--black); transform: rotate(-6deg); font: 900 21px 'Orbitron',sans-serif; }
  .slide-4 .bts-footer { position: absolute; z-index: 9; left: 54px; right: 50px; bottom: 47px; display: flex; align-items: center; justify-content: space-between; font: 700 17px 'Orbitron',sans-serif; letter-spacing: .13em; text-shadow: 0 1px #fff; }

  /* 05 — shop card / polished cutout collage */
  .slide-5 .cta-photo { left: 74px; top: 100px; width: 620px; height: 770px; transform: rotate(-3deg); }
  .slide-5 .cta-sticker { right: 47px; top: 255px; width: 280px; height: 280px; padding: 45px; z-index: 9; font: 900 31px/1.05 'Orbitron',sans-serif; }
  .slide-5 .cta-copy { position: absolute; z-index: 9; left: 54px; right: 54px; bottom: 76px; padding: 40px 45px; background: var(--black); color: white; border: 5px solid var(--black); border-radius: 26px; box-shadow: 12px 13px 0 var(--pink); }
  .slide-5 .cta-copy .shop { font: 900 86px/.95 'Orbitron',sans-serif; letter-spacing: -.08em; color: var(--blue); text-shadow: 4px 4px 0 var(--pink); }
  .slide-5 .cta-copy .details { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; font: 700 21px 'Space Grotesk',sans-serif; letter-spacing: .05em; }
  .slide-5 .cta-copy .url { margin-top: 18px; color: var(--lime); font: 700 21px 'Orbitron',sans-serif; letter-spacing: .05em; }

  .slide-index { position: absolute; z-index: 10; right: 42px; top: 43px; width: 56px; height: 56px; display: grid; place-items: center; background: white; border: 4px solid var(--black); border-radius: 50%; font: 900 18px 'Orbitron',sans-serif; box-shadow: 4px 5px 0 var(--pink); }
  .spark { position: absolute; z-index: 6; color: var(--pink); -webkit-text-stroke: 1px var(--black); font-size: 50px; text-shadow: 3px 4px #fff; }
  .no-reprints { display: inline-block; padding: 9px 14px; color: white; background: var(--pink); border: 3px solid var(--black); border-radius: 5px; box-shadow: 4px 5px 0 var(--black); font: 700 16px 'Orbitron',sans-serif; transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="canvas">
  <main class="frame" id="frame"></main>
</div>
<script>
(function () {
  var slideNo = Number('__SLIDE_N__');
  var front = '../../public/images/pink-silver-crop-top-front.png';
  var back = '../../public/images/pink-silver-crop-top-back.png';
  var logo = '../../public/images/logo.png';
  var maker = '__MAKER_IMAGE__';
  var frame = document.getElementById('frame');
  var img = function(src, alt) { return '<img src="' + src + '" alt="' + alt + '">'; };
  var scenes = {
    1: '<div class="slide-1">' +
      '<div class="topline"><div class="logo-tile">' + img(logo, 'Coalition logo') + '</div><span class="label-bar">Y2K archive / 01</span></div>' +
      '<div class="media hero-photo">' + img(front, 'Pink leopard crop top front') + '</div>' +
      '<div class="title display"><span class="pink-word">PINK</span><span class="silver-word chrome">/ SILVER</span></div>' +
      '<div class="sticker sticker-star micro">LIMITED<br>EDITION<br>1 OF 12</div>' +
      '<div class="product-name">WOMEN’S LEOPARD PRINT CROP T-SHIRT</div>' +
      '<div class="issue">TRUST YOURSELF ✦</div><div class="price-tag">$45</div>' +
      '<span class="spark" style="left:52px;top:330px">✦</span><span class="spark" style="right:95px;top:280px">✧</span></div>',
    2: '<div class="slide-2">' +
      '<span class="eyebrow label-bar">DETAIL STUDY / 02</span>' +
      '<div class="headline display chrome">SILVER<br>ON ROSE.</div>' +
      '<div class="media detail-photo">' + img(back, 'Pink leopard crop top back detail') + '</div>' +
      '<div class="caption">Pink leopard print. 3D silver puff lettering.<br>Trust Yourself — front to back.</div>' +
      '<div class="mini-sticker">UP CLOSE ✦</div><span class="spark" style="right:70px;top:165px">✧</span></div>',
    3: '<div class="slide-3">' +
      '<span class="eyebrow label-bar">COLLECTOR’S RUN / 03</span>' +
      '<div class="media run-photo">' + img(front, 'Pink leopard crop top front') + '</div>' +
      '<div class="run-count display chrome">ONE RUN<span>ONLY.</span></div>' +
      '<div class="run-panel"><div><div class="qty">1 OF 12</div><small>No reprints</small></div><div class="price">$45<small>Sizes S–XL</small></div></div>' +
      '<span class="spark" style="right:640px;top:235px">✦</span></div>',
    4: '<div class="slide-4">' +
      '<span class="eyebrow label-bar" style="position:absolute;left:47px;top:35px;z-index:9">COALITION / BTS</span>' +
      '<div class="media maker-photo">' + img(maker, 'Behind-the-scenes sewing studio photo') + '</div>' +
      '<div class="note-card"><div class="kicker">MADE WITH INTENTION</div><div class="belief">TRUST<br>YOURSELF.</div><div class="sub">Coalition is action.<br>Show up.</div></div>' +
      '<div class="bts-tag">THE WORK<br>BEHIND THE DROP ✦</div>' +
      '<div class="bts-footer"><span>PINK / SILVER</span><span>04 — STUDIO NOTES</span></div></div>',
    5: '<div class="slide-5">' +
      '<span class="eyebrow label-bar" style="position:absolute;left:48px;top:42px;z-index:9">THE FINAL LOOK / 05</span>' +
      '<div class="media cta-photo">' + img(front, 'Pink leopard crop top front') + '</div>' +
      '<div class="sticker sticker-star cta-sticker">ONE OF<br>TWELVE<br>✦</div>' +
      '<div class="cta-copy"><div class="shop">SHOP<br>THE DROP →</div><div class="details"><span>$45</span><span>S–XL</span><span>NO REPRINTS</span></div><div class="url">sgcoalition.xyz/shop</div></div>' +
      '<span class="spark" style="left:735px;top:140px">✦</span></div>'
  };
  frame.innerHTML = '<div class="slide-index">' + String(slideNo).padStart(2,'0') + '</div>' + scenes[slideNo];
})();
</script>
</body>
</html>
