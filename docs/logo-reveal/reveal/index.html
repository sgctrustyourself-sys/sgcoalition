<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        /* GROUND — near-black warm charcoal */
        background: #0d0d10;
      }
      #root {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      /* ── Fields: three large, soft, slow colour washes. Colour only — no imagery. ── */
      .field {
        position: absolute; border-radius: 50%;
        filter: blur(140px); opacity: 0.55;
        will-change: transform;
      }
      /* FIELD 1 — chrome/ice blue (the "silver" of the palette) */
      #field-a { width: 1100px; height: 1100px; left: -180px; top: -220px;
        background: radial-gradient(circle, rgba(126,200,232,0.50) 0%, rgba(126,200,232,0) 70%); }
      /* FIELD 2 — chrome orange (lifted from the hoodie lettering) */
      #field-b { width: 1240px; height: 1240px; right: -260px; top: 120px;
        background: radial-gradient(circle, rgba(255,106,26,0.42) 0%, rgba(255,106,26,0) 70%); }
      /* FIELD 3 — hot magenta/pink (PINK / SILVER lineage) */
      #field-c { width: 980px; height: 980px; left: 520px; bottom: -320px;
        background: radial-gradient(circle, rgba(255,61,175,0.36) 0%, rgba(255,61,175,0) 70%); }

      /* ── The lockup: the crispest thing in the film. Nothing liquid after the rupture. ── */
      #lockup {
        position: absolute; left: 50%; top: 50%;
        width: 940px; height: 347px; margin-left: -470px; margin-top: -174px;
        opacity: 0; object-fit: contain;
      }

      /* grain pass — texture only, no imagery */
      #grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.10;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="field-a" class="field clip" data-start="0" data-duration="7"></div>
      <div id="field-b" class="field clip" data-start="0" data-duration="7"></div>
      <div id="field-c" class="field clip" data-start="0" data-duration="7"></div>

      <!-- the liquid: its own composition, mounted for 0–3.7s (beats 1–5) -->
      <div
        id="liquidMount"
        data-composition-id="liquid"
        data-composition-src="./compositions/liquid.html"
        class="clip"
        data-start="0"
        data-duration="3.7"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- lockup lands at the rupture; official artwork at official proportions -->
      <img id="lockup" class="clip" src="assets/logo-lockup.png" alt="Coalition" data-start="3.43" data-duration="3.57" />

      <div id="grain" class="clip" data-start="0" data-duration="7"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

      /* Rupture = 3.43s. Everything before is approach; everything after is consequence. */

      /* fields drift slowly through the approach and the event, then freeze at
         rupture+2s — after that, nothing in the film moves but nothing at all */
      tl.fromTo('#field-a', { x: 0, y: 0 },     { x: 93,   y: 47,   duration: 5.4, ease: 'none' }, 0);
      tl.fromTo('#field-b', { x: 0, y: 0 },     { x: -108, y: -31,  duration: 5.4, ease: 'none' }, 0);
      tl.fromTo('#field-c', { x: 0, y: 0 },     { x: 47,   y: -62,  duration: 5.4, ease: 'none' }, 0);

      /* the lockup lands and recoils — from the rupture point, outward */
      tl.fromTo('#lockup',
        { scale: 0.86, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: 'back.out(2.2)' },
        3.55);

      /* ── Beat 6 · hold (4.66–7.00) — the lockup, alone, still. Nothing moves. ── */

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
