<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        /* GROUND — the reveal's exact ground, for one continuous film */
        background: #0d0d10;
      }
      #root {
        width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      /* ── Fields: the reveal's three washes, re-geometry for vertical.
             Present the whole 17s so the ground is one world; they only
             drift once the liquid mounts (11.0s), then freeze. ── */
      .field {
        position: absolute; border-radius: 50%;
        filter: blur(140px); opacity: 0.55;
        will-change: transform;
      }
      /* FIELD 1 — chrome/ice blue (the "silver" of the palette) */
      #field-a { width: 1240px; height: 1240px; left: -320px; top: -260px;
        background: radial-gradient(circle, rgba(126,200,232,0.50) 0%, rgba(126,200,232,0) 70%); }
      /* FIELD 2 — chrome orange (lifted from the hoodie lettering) */
      #field-b { width: 1360px; height: 1360px; right: -360px; top: 420px;
        background: radial-gradient(circle, rgba(255,106,26,0.42) 0%, rgba(255,106,26,0) 70%); }
      /* FIELD 3 — hot magenta/pink (PINK / SILVER lineage) */
      #field-c { width: 1120px; height: 1120px; left: 240px; bottom: -380px;
        background: radial-gradient(circle, rgba(255,61,175,0.36) 0%, rgba(255,61,175,0) 70%); }

      /* ── The five fleece carousel slides. 1080×1350 art, fit to width,
             centered on the 1920-tall frame — the honest letterbox, no crop
             of caption art. Full opacity at entry: these are flat-colour
             stills, a fade-up would only read as flicker. ── */
      .slide {
        position: absolute; left: 0; top: 285px;
        width: 1080px; height: 1350px;
        object-fit: fill; will-change: transform;
      }
      /* ── CTA veil: fades IN over slide 5 for the dip-to-ground (10.68–11.0s).
         Fading a veil up over the art — instead of fading the art out — keeps
         every timeline element single-motion and top-level. ── */
      #cta-veil {
        position: absolute; left: -30px; top: 240px;
        width: 1140px; height: 1440px;
        background: #0d0d10;
      }

      /* ── The liquid: native 1080×1920 retarget, mounted 11.0–14.7s.
             Rupture lands at 14.43s on the reel clock. ── */
      #liquidMount {
        position: absolute; inset: 0;
      }

      /* ── The lockup: the crispest thing in the film. Same artwork,
             same proportions, sized for a phone-width frame. ── */
      #lockup {
        position: absolute; left: 50%; top: 48%;
        width: 660px; height: 244px; margin-left: -330px; margin-top: -122px;
        opacity: 0; object-fit: contain;
      }

      /* grain pass — the reveal's exact seeded texture, over everything */
      #grain {
        position: absolute; inset: 0; pointer-events: none; opacity: 0.10;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.84' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel"
      data-start="0"
      data-duration="17"
      data-width="1080"
      data-height="1920"
    >
      <div id="field-a" class="field clip" data-start="0" data-duration="17"></div>
      <div id="field-b" class="field clip" data-start="0" data-duration="17"></div>
      <div id="field-c" class="field clip" data-start="0" data-duration="17"></div>

      <!-- ── Act 1 · the fleece carousel, 0–11.0s. Five 2.2s windows. ── -->
      <img id="slide-1" class="slide clip" src="assets/y2k-fleece-slide-1.png" alt="" data-start="0"    data-duration="2.2" />
      <img id="slide-2" class="slide clip" src="assets/y2k-fleece-slide-2.png" alt="" data-start="2.2"  data-duration="2.2" />
      <img id="slide-3" class="slide clip" src="assets/y2k-fleece-slide-3.png" alt="" data-start="4.4"  data-duration="2.2" />
      <img id="slide-4" class="slide clip" src="assets/y2k-fleece-slide-4.png" alt="" data-start="6.6"  data-duration="2.2" />
      <img id="slide-5" class="slide clip" src="assets/y2k-fleece-slide-5.png" alt="" data-start="8.8"  data-duration="2.2" />

      <div id="cta-veil" class="clip" data-start="10.68" data-duration="0.32"></div>

      <!-- ── Act 2 · the liquid reveal, 11.0–17.0s (rupture 14.43s) ── -->
      <div
        id="liquidMount"
        data-composition-id="liquid"
        data-composition-src="./compositions/liquid.html"
        class="clip"
        data-start="11"
        data-duration="3.7"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- lockup lands at the rupture; official artwork at official proportions -->
      <img id="lockup" class="clip" src="assets/logo-lockup.png" alt="Coalition" data-start="14.43" data-duration="2.57" />

      <div id="grain" class="clip" data-start="0" data-duration="17"></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });

      /* Rupture = 14.43s on the reel clock (3.43s into the mounted liquid).
         Everything before is approach; everything after is consequence. */

      /* ── Act 1 · Ken Burns on the carousel — slow pushes and glides,
             cut-to-cut like a flicked carousel. Linear ease: authored,
             deterministic, nothing bouncing. ── */
      tl.fromTo('#slide-1', { scale: 1.015 },            { scale: 1.045, duration: 2.2, ease: 'none' }, 0);
      tl.fromTo('#slide-2', { x: -12, scale: 1.03 },     { x: 10, scale: 1.03, duration: 2.2, ease: 'none' }, 2.2);
      tl.fromTo('#slide-3', { y: 50, scale: 1.03 },      { y: -50, scale: 1.03, duration: 2.2, ease: 'none' }, 4.4);
      tl.fromTo('#slide-4', { scale: 1.045 },            { scale: 1.02, duration: 2.2, ease: 'none' }, 6.6);
      tl.fromTo('#slide-5', { y: -20, scale: 1.02 },     { y: 0, scale: 1.05, duration: 2.2, ease: 'none' }, 8.8);

      /* the CTA dips to ground under the liquid world — the lights go down
         before the event, instead of a dead cut into black. A ground-coloured
         veil fades IN over the slide; the img itself carries only the tween. */
      tl.fromTo('#cta-veil', { opacity: 0 }, { opacity: 1, duration: 0.32, ease: 'power2.in' }, 10.68);

      /* ── Act 2 · the fields drift through the approach and the event,
             then freeze at rupture+2s — after that, nothing in the film
             moves but nothing at all ── */
      tl.fromTo('#field-a', { x: 0, y: 0 }, { x: 70,  y: 36,  duration: 5.4, ease: 'none' }, 11);
      tl.fromTo('#field-b', { x: 0, y: 0 }, { x: -81, y: -25, duration: 5.4, ease: 'none' }, 11);
      tl.fromTo('#field-c', { x: 0, y: 0 }, { x: 35,  y: -47, duration: 5.4, ease: 'none' }, 11);

      /* the lockup lands and recoils — from the rupture point, outward */
      tl.fromTo('#lockup',
        { scale: 0.86, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 0.5, ease: 'back.out(2.2)' },
        14.55);

      /* ── Hold (15.05–17.00) — the lockup, alone, still. Nothing moves. ── */

      window.__timelines = window.__timelines || {};
      window.__timelines['reel'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
