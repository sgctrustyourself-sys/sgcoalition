<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parts Reel — Linktree CTA and Wallet Stitch Ending</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111; color: #f5f3f0; }
    body { margin: 0; padding: clamp(1rem, 4vw, 3rem); }
    main { max-width: 1100px; margin: auto; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.6rem, 4vw, 2.5rem); }
    p { margin: 0 0 1.5rem; color: #bbb; }
    .sheet { display: block; width: min(100%, 760px); margin: 0 auto 2rem; border-radius: 12px; }
    .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    figure { margin: 0; overflow: hidden; background: #1c1c1c; border: 1px solid #333; border-radius: 10px; }
    figure img { display: block; width: 100%; height: auto; }
    figcaption { padding: .65rem .8rem; color: #ddd; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>

    <img class="sheet" src="parts-reel/renders/mp4-contact-sheet.jpg" alt="Contact sheet showing eight frames from the parts reel">
    <section class="frames" aria-label="Individual extracted frames">
      <figure><img src="parts-reel/renders/mp4frames/fr-12.png" alt="Parts reel frame at 1.2 seconds"><figcaption>1.2 seconds</figcaption></figure>

      <figure><img src="parts-reel/renders/mp4frames/fr-119.png" alt="Parts reel frame at 11.9 seconds"><figcaption>11.9 seconds</figcaption></figure>
      <figure><img src="parts-reel/renders/mp4frames/fr-125.png" alt="Parts reel frame at 12.5 seconds"><figcaption>12.5 seconds</figcaption></figure>
      <figure><img src="parts-reel/renders/mp4frames/fr-142.png" alt="Parts reel frame at 14.16 seconds"><figcaption>14.16 seconds</figcaption></figure>

</body>
