<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>vector card zoom</title>
<style>
html,body{margin:0;background:#111;color:#eee;font:14px sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.win{position:relative;height:445px;overflow:hidden;border:2px solid #444;background:#000}
.win .cap{position:absolute;z-index:2;left:8px;top:8px;background:#000c;padding:4px 8px;letter-spacing:.1em}
.win img{position:absolute;width:2160px;height:2700px;max-width:none}
</style></head>
<body>
<div class="grid">
  <!-- card1 occupies x 120..520, y 480..1055 of 1080x1350; 2x zoom => 240..1040, 960..2110 -->
  <div class="win"><div class="cap">V1 · TOP PANEL (SKULL GANG)</div>
    <img class="z" src="ghost-riders-after-dark.svg" style="left:-240px;top:-960px"></div>
  <div class="win"><div class="cap">V2 · BOTTOM PANEL (BANNER BACK)</div>
    <img class="z" src="ghost-riders-after-dark.svg" style="left:-240px;top:-1560px"></div>
</div>
<script>document.querySelectorAll('img.z').forEach(i=>i.src+='?v='+Date.now());</script>
</body></html>
