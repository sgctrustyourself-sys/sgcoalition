<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>study — back (banner)</title>
<style>
html,body{margin:0;background:#111;color:#eee;font:14px sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.win{position:relative;height:440px;overflow:hidden;border:2px solid #444;background:#000}
.win .cap{position:absolute;z-index:2;left:8px;top:8px;background:#000c;padding:4px 8px;letter-spacing:.1em}
.win .ph{position:absolute;inset:0;background-repeat:no-repeat;background-size:260%;}
</style></head>
<body>
<div class="grid">
  <div class="win"><div class="cap">B1 · SKY + MOON + CLOUDS</div>
    <div class="ph" style="background-image:url('ghost-riders-skulls.jpg');background-position:45% 18%"></div></div>
  <div class="win"><div class="cap">B2 · MOUNTAINS</div>
    <div class="ph" style="background-image:url('ghost-riders-skulls.jpg');background-position:35% 36%"></div></div>
  <div class="win"><div class="cap">B3 · BANNER + SCRIPT</div>
    <div class="ph" style="background-image:url('ghost-riders-skulls.jpg');background-position:50% 52%"></div></div>
  <div class="win"><div class="cap">B4 · RIDER + BOTTOM SKULLS + STITCH</div>
    <div class="ph" style="background-image:url('ghost-riders-skulls.jpg');background-position:50% 82%"></div></div>
</div>
</body></html>
